name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash setup_know_syria.sh
      - name: Build APK
        run: |
          set +e
          flutter build apk --release 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -A12 "What went wrong" build.log | head -25)
            if [ -z "$msg" ]; then msg=$(grep -iE "error|failed" build.log | head -15); fi
            msg=$(printf '%s\n' "$msg" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: know-syria-apk
          path: build/app/outputs/flutter-apk/app-release.apk
